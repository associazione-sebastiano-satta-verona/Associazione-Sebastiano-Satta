 server";banner.style.display="block"},5000);try{const res=await fetch("https://jfdqkbdqyrdqsxoippgy.supabase.co/functions/v1/check-manutenzione");if(timeoutReached)return;clearTimeout(timeout);if(!res.ok){banner.textContent="⚠️ Sito in manutenzione";banner.style.display="block";return}const data=await res.json();if(data.status==="maintenance"){banner.textContent="⚠️ Sito in manutenzione";banner.style.display="block"}}catch(e){if(!timeoutReached){clearTimeout(timeout);banner.textContent="⚠️ Impossibile contattare il server";banner.style.display="block"}}}checkServerStatus();</script><noscript><style>body{margin:0;padding:0;overflow:hidden!important}#noscript-overlay{position:fixed;top:0;left:0;width:100vw;height:100vh;background:linear-gradient(90deg,#d40000,#0044ff);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:30px;box-sizing:border-box;text-align:center;color:#fff;font-family:Arial,sans-serif;z-index:999999}#noscript-overlay img{width:120px;height:120px;border-radius:35%;margin-bottom:25px;box-shadow:0 4px 14px rgba(0,0,0,.25)}#noscript-overlay h1{font-size:26px;font-weight:800;margin-bottom:15px}#noscript-overlay p{font-size:18px;line-height:1.5;max-width:500px}</style><div id="noscript-overlay"><img src="logo.png" alt="Logo Associazione Sardi Sebastiano Satta di Verona"><h1>JavaScript necessario</h1><p>Il sito dell'Associazione Sardi "Sebastiano Satta" di Verona ha bisogno di JavaScript abilitato sul dispositivo per funzionare correttamente.<br><br>Per favore, abilitalo nelle impostazioni del browser e ricarica la pagina.</p></div></noscript></body></html>
