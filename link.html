<!DOCTYPE html><html lang="it"><head><meta name="theme-color" content="#d40000"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><link rel="icon" type="image/png" href="logo-transparent.png"><title>Reindirizzamento link...</title><style>body{font-family:Arial,sans-serif;background:#fff;margin:0;padding:0;padding-top:80px}.header{display:flex;align-items:center;padding:12px 20px;background:linear-gradient(90deg,#d40000,#0044ff);color:#fff;position:fixed;top:0;left:0;width:100%;z-index:999;transition:backdrop-filter .3s ease,background .3s ease}.header.scrolled{backdrop-filter:blur(12px) brightness(1.35) saturate(160%);background:linear-gradient(90deg,rgba(212,0,0,.70),rgba(0,68,255,.70))}.header img{height:48px;width:48px;border-radius:50%;margin-right:15px;cursor:pointer}.header-title{font-size:20px;font-weight:700;white-space:normal;word-break:break-word;line-height:1.2;max-width:80%}@media (max-width:380px){.header-title{font-size:17px}.header img{width:40px;height:40px}}.loading-bar-container{width:100%;max-width:420px;height:12px;background:#e0e0e0;border-radius:10px;margin:40px auto 20px auto;overflow:hidden;display:none}.loading-bar{height:100%;width:0;background:linear-gradient(90deg,#d40000,#0044ff);border-radius:10px;transition:width .25s ease}#messaggio{font-size:20px;color:#666;text-align:center;padding:40px}</style></head><body><div class="header"><img id="logo-home" src="logo.png" alt="Logo Associazione dei Sardi Sebastiano Satta di Verona"><div class="header-title">Associazione dei Sardi "Sebastiano Satta" di Verona</div></div><div id="loading-bar-container" class="loading-bar-container"><div id="loading-bar" class="loading-bar"></div></div><div id="messaggio"></div><script>const ORIGIN = "https://associazione-sebastiano-satta-verona.github.io";const FUNCTION_URL = "https://jfdqkbdqyrdqsxoippgy.supabase.co/functions/v1/resolve-link";function startLoadingBar(){ const c=document.getElementById("loading-bar-container"); const b=document.getElementById("loading-bar"); c.style.display="block"; let p=0; const i=setInterval(()=>{ p+=10; b.style.width=p+"%"; if(p>=90)clearInterval(i); },200); return()=>{ b.style.width="100%"; setTimeout(()=>c.style.display="none",300); };}async function resolveLink(){ const params=new URLSearchParams(window.location.search); const id=params.get("id"); if(!id){ document.getElementById("messaggio").innerHTML= `<div style="text-align:center;padding:40px;font-size:20px;color:#666;">Nessun link disponibile.</div>`; return; } const stop=startLoadingBar(); try{ const res = await fetch(`${FUNCTION_URL}?id=${id}`, { method: "GET", headers: { "Origin": ORIGIN } }); stop(); if(!res.ok){ document.getElementById("messaggio").innerHTML= `<div style="text-align:center;padding:40px;font-size:20px;color:#666;">Nessun link disponibile.</div>`; return; } const data = await res.json(); if(!data || !data.url){ document.getElementById("messaggio").innerHTML= `<div style="text-align:center;padding:40px;font-size:20px;color:#666;">Nessun link disponibile.</div>`; return; } window.location.href = data.url; } catch(e){ stop(); document.getElementById("messaggio").innerHTML= `<div style="text-align:center;padding:40px;font-size:20px;color:#666;">Impossibile contattare il server.</div>`; }}resolveLink();window.addEventListener("scroll",()=>{ const h=document.querySelector(".header"); window.scrollY>10?h.classList.add("scrolled"):h.classList.remove("scrolled");});document.getElementById("logo-home").addEventListener("click",()=>{ window.location.href="index.html";});</script></body></html>
